name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadiek Kazim | Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            text-align: center;
        }
        .badge {
            background-color: #3b82f6;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .player-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            margin: 0 auto 15px auto;
            background-color: #334155;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-box h3 {
            font-size: 22px;
            color: #3b82f6;
            margin-bottom: 5px;
        }
        .stat-box p {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .info-list {
            text-align: left;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 14px;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #94a3b8;
        }
        .info-value {
            font-weight: bold;
            color: #f8fafc;
        }
        .footer-text {
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Official Profile ⚽</div>
        
        <!-- Halkaan waxaad ku beddeli kartaa linkiga sawirkaaga haddii aad rabto -->
        <div class="player-img" style="display: flex; align-items: center; justify-content: center; font-size: 35px;">
            ⚡
        </div>

        <h1>SADIEK KAZIM</h1>
        <p class="subtitle">SADIEKH • Professional Football Player</p>

        <div class="stats-grid">
            <div class="stat-box">
                <h3>16</h3>
                <p>Da'da (Age)</p>
            </div>
            <div class="stat-box">
                <h3>34</h3>
                <p>Goolasha</p>
            </div>
        </div>

        <div class="info-list">
            <div class="info-item">
                <span class="info-label">Kooxda (Club)</span>
                <span class="info-value">Onkod FC</span>
            </div>
            <div class="info-item">
                <span class="info-label">Booska (Position)</span>
                <span class="info-value">LWF (#22)</span>
            </div>
            <div class="info-item">
                <span class="info-label">Deegaanka</span>
                <span class="info-value">Cabudwaaq, Somalia</span>
            </div>
        </div>

        <div class="footer-text">
            &copy; 2026 Onkod FC. All Rights Reserved.
        </div>
    </div>

</body>
</html>
